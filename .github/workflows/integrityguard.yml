name: IntegrityGuard

on:
  push:
  pull_request:

jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: python -m pip install -r requirements.txt

      - name: Проверка синтаксиса пакета
        run: python -m compileall -q integrityguard

      - name: Проверка командной строки
        run: python -m integrityguard --help
